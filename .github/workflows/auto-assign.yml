name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: Assign the issue or pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: |
        set -euo pipefail
        [[ "$ITEM_NUMBER" =~ ^[0-9]+$ ]]
        gh api --method POST "repos/${GH_REPO}/issues/${ITEM_NUMBER}/assignees" -f 'assignees[]=rodchalski'
